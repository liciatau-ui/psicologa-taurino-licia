services:
  - type: web
    name: psicologa-taurino-licia
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: psicologa-taurino-db
          property: connectionString

databases:
  - name: psicologa-taurino-db
    plan: free
